<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeniro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Press+Start+2P&family=Pacifico&family=Caveat:wght@700&family=Oswald:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Botão Mobile (Some quando abre o menu) -->
        <button id="mobile-menu-btn" class="icon-btn mobile-only">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>

        <!-- Fundo escuro para o menu mobile -->
        <div id="sidebar-backdrop" class="hidden"></div>

        <!-- Sidebar de Servidores -->
        <nav class="server-sidebar" id="server-sidebar">
            <div class="server-icon active" data-server="global" title="Início">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 2L2 22h20L12 2zm0 3.8l7.5 14.2H4.5L12 5.8z"/></svg>
            </div>
            <div id="server-list" class="server-list"></div>
            
            <button class="server-icon add-btn" id="create-server-btn" title="Criar Servidor">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            <button class="server-icon search-btn" id="search-server-btn" title="Descobrir Servidores">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
        </nav>

        <!-- Sidebar de Canais -->
        <aside class="channel-sidebar" id="channel-sidebar">
            <div class="server-header">
                <span id="current-server-name">Início</span>
                <button id="edit-server-btn" class="icon-btn hidden" title="Configurações do Servidor">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                </button>
            </div>
            <div class="channels">
                <h3>CANAIS DE TEXTO</h3>
                <div class="channel active"># geral</div>
            </div>
            <div class="user-panel">
                <div class="user-info" id="open-profile-btn">
                    <img src="zenirobg.png" id="my-avatar" alt="Avatar" onerror="this.src='https://via.placeholder.com/32'">
                    <div class="user-details">
                        <span id="my-name">...</span>
                    </div>
                </div>
                <button class="icon-btn" id="edit-profile-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </button>
            </div>
        </aside>

        <!-- Área do Chat -->
        <main class="chat-area" id="chat-area">
            <header class="chat-header">
                <h2># geral</h2>
                <div class="call-actions">
                    <button id="start-audio-call" class="icon-btn"><svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1C8.8 6.45 8.6 5.25 8.6 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1zM12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></button>
                    <button id="start-video-call" class="icon-btn"><svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
                </div>
            </header>
            
            <div class="messages" id="messages-container">
                <!-- Fundo Zeniro -->
                <div class="empty-bg" id="empty-bg"><img src="zenirobg.png" alt="Zeniro Logo"></div>
            </div>

            <!-- Área de Input -->
            <div class="chat-input-wrapper">
                <div id="reply-context" class="hidden">
                    <div class="reply-info">
                        <span>Respondendo a <strong id="reply-name"></strong></span>
                        <p id="reply-text"></p>
                    </div>
                    <button id="cancel-reply" class="icon-btn"><svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
                </div>

                <div class="chat-input-area">
                    <button id="plus-btn" class="icon-btn"><svg viewBox="0 0 24 24" width="24" height="24" fill="#b9bbbe"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
                    <input type="file" id="image-upload" accept="image/*" class="hidden">
                    
                    <button id="emoji-btn" class="icon-btn"><svg viewBox="0 0 24 24" width="24" height="24" fill="#b9bbbe"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
                    <button id="gif-btn" class="icon-btn" style="font-weight:bold;font-size:12px;color:#b9bbbe;">GIF</button>
                    
                    <input type="text" id="message-input" placeholder="Conversar..." autocomplete="off">
                    <button id="send-btn" class="icon-btn"><svg viewBox="0 0 24 24" width="24" height="24" fill="#5865F2"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: VISUALIZAR / EDITAR PERFIL (COM PREVIEW EM TEMPO REAL) -->
    <div id="profile-modal" class="modal hidden">
        <div class="modal-content profile-edit-container">
            <h2>Editar Perfil</h2>
            
            <div class="profile-preview" id="live-preview">
                <div class="preview-banner" id="preview-banner"></div>
                <img id="preview-avatar" src="" alt="Avatar">
                <h3 id="preview-name">Seu Nome</h3>
                <p id="preview-bio">Sua bio aqui...</p>
            </div>

            <div class="input-group">
                <label>Nome</label>
                <input type="text" id="edit-name" oninput="updatePreview()">
            </div>
            <div class="input-group">
                <label>Bio</label>
                <textarea id="edit-bio" oninput="updatePreview()"></textarea>
            </div>
            <div class="input-group">
                <label>Fonte</label>
                <select id="edit-font" onchange="updatePreview()">
                    <option value="'Inter', sans-serif">Padrão</option>
                    <option value="'Press Start 2P', cursive">Retro Gamer</option>
                    <option value="'Pacifico', cursive">Caligráfica</option>
                    <option value="'Caveat', cursive">Manuscrita</option>
                    <option value="'Oswald', sans-serif">Impacto</option>
                </select>
            </div>
            <div class="input-group">
                <label>Avatar (URL)</label>
                <input type="text" id="edit-avatar-url" placeholder="https://..." oninput="updatePreview()">
            </div>
            <div class="input-group">
                <label>Banner (URL)</label>
                <input type="text" id="edit-banner-url" placeholder="https://..." oninput="updatePreview()">
            </div>
            <div class="input-group">
                <label>Ou envie uma foto (Base64)</label>
                <input type="file" id="edit-avatar-file" accept="image/*">
            </div>

            <div class="modal-actions">
                <button class="secondary-btn close-modal">Cancelar</button>
                <button class="primary-btn" id="save-profile">Salvar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: BUSCAR SERVIDOR -->
    <div id="search-server-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Descobrir Servidores</h2>
            <input type="text" id="search-server-input" placeholder="Pesquisar por nome...">
            <div id="search-results" class="search-results"></div>
            <div class="modal-actions">
                <button class="secondary-btn close-search-modal">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MENU DE CONTEXTO (RESPONDER) -->
    <div id="context-menu" class="context-menu hidden">
        <button id="ctx-reply">Responder</button>
    </div>

    <!-- TELA CHEIA DE CHAMADA -->
    <div id="call-overlay" class="hidden">
        <video id="remote-video" autoplay></video>
        <video id="local-video" autoplay muted></video>
        
        <div class="call-controls">
            <button id="toggle-mic" class="call-ctrl-btn active" title="Mudo">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
            </button>
            <button id="call-settings-btn" class="call-ctrl-btn" title="Configurações">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
            </button>
            <button id="end-call" class="call-ctrl-btn danger">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
            <button id="toggle-video" class="call-ctrl-btn active" title="Câmera">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
        </div>

        <!-- Painel de Configurações de Call -->
        <div id="call-settings-panel" class="hidden">
            <h3>Dispositivos</h3>
            <label>Microfone</label>
            <select id="mic-select"></select>
            <label>Câmera</label>
            <select id="camera-select"></select>
            <button class="primary-btn" id="close-call-settings">Fechar</button>
        </div>
    </div>

    <!-- PAINEL DE EMOJIS (MUITOS) -->
    <div id="emoji-picker" class="picker-panel hidden">
        <input type="text" id="emoji-search" placeholder="Pesquisar emoji...">
        <div id="emoji-list" class="emoji-grid"></div>
    </div>

    <!-- PAINEL DE GIFS -->
    <div id="gif-picker" class="picker-panel hidden">
        <input type="text" id="gif-search" placeholder="Pesquisar GIFs (Tenor)...">
        <div id="gif-list" class="gif-grid"></div>
    </div>

    <!-- VISUALIZADOR DE IMAGEM EM TELA CHEIA -->
    <div id="image-viewer" class="modal hidden">
        <div class="image-viewer-content">
            <img id="viewer-img" src="" alt="Imagem">
            <div class="viewer-actions">
                <a id="download-img-btn" class="primary-btn" download="zeniro-imagem.png" target="_blank">Baixar Imagem</a>
                <button class="secondary-btn" onclick="document.getElementById('image-viewer').classList.add('hidden')">Fechar</button>
            </div>
        </div>
    </div>

    <!-- CANVAS OCULTO PARA REDIMENSIONAR IMAGENS -->
    <canvas id="resize-canvas" class="hidden"></canvas>

    <script type="module" src="app.js"></script>
</body>
                    </html>
